[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-wiki-mini"
version = "0.1.0"
description = "Local-first markdown knowledge compiler with serious raw-context vs wiki validation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dor Vidan" }]
keywords = ["llm", "wiki", "rag", "knowledge-base", "evaluation", "local-first"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "build>=1.2",
  "ruff>=0.6",
]

[project.scripts]
llm-wiki-mini = "llm_wiki_mini.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_wiki_mini"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
  "eval_runs*",
  ".git",
  ".pytest_cache",
  ".venv",
  "dist",
  "build",
]

[tool.ruff.lint]
# Start production CI with correctness-oriented linting only. The codebase is
# intentionally compact/prototype-style; formatting cleanup can be tightened later.
select = ["F"]
ignore = ["E501"]
